# 공통 기본값. 서버별 값은 values-<서버>.yaml에서 덮어쓴다.
name: spring-error-app

# 배포 전략: canary | bluegreen | rolling
strategy: rolling

image:
  repository: harbor.lab:30002/member-a/spring-error-app   # 실습 DNS 이름 (전: localhost:30002)
  tag: 71b1d3b

errorRate: "0"                 # 장애 버전 시험은 "0.3"
appVersion: v5

replicas: 5
startDelaySeconds: 0           # 앱이 뜨기 전 일부러 기다리는 시간 (모델 서버 흉내)
startupFailureThreshold: 12    # 시작 확인 허용 횟수. 5초 × 12 = 60초
preStopSleepSeconds: 5         # 종료 전 대기. Service에서 빠지는 동안 받은 요청을 처리

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# 분석: 새 버전에 요청 50건, 오류 5% 이상이면 실패
analysis:
  requests: 50
  maxErrorPercent: 5
  interval: 20s                # 카나리 백그라운드 분석 간격
