apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-error-rate
spec:
  metrics:
    - name: canary-error-rate
      interval: 20s
      count: 3
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: check
                    image: curlimages/curl:8.10.1
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c"]
                    args:
                      - |
                        n=50
                        fail=0
                        for i in $(seq 1 $n); do
                          code=$(curl -s -o /dev/null -w '%{http_code}' http://spring-error-app-canary/api/hello)
                          [ "$code" != "200" ] && fail=$((fail+1))
                        done
                        echo "errors=${fail}/${n}"
                        [ $((fail * 100)) -lt $((n * 5)) ]
