apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: spring-error-app
spec:
  replicas: 5
  revisionHistoryLimit: 3
  # [롤링일 때만 주석 해제] 300초 동안 진행이 없으면 자동 중단
  # progressDeadlineSeconds: 300
  # progressDeadlineAbort: true
  selector:
    matchLabels:
      app: spring-error-app
  template:
    metadata:
      labels:
        app: spring-error-app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: localhost:30002/member-a/spring-error-app:0ea331b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ERROR_RATE
              value: "0"
            - name: APP_VERSION
              value: "v5"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  # 전략은 하나만 켠다. 바꿀 때는 지금 켜진 블록을 주석 처리하고 다른 블록의 주석을 푼다.
  strategy:
    # ── 카나리 (부록 G): 20→40→60→80%, 단계 사이 30초, 40%부터 20초마다 분석 ──
    canary:
      canaryService: spring-error-app-canary
      analysis:
        templates:
          - templateName: error-rate-background
        startingStep: 2
        args:
          - name: service-name
            value: spring-error-app-canary
      steps:
        - setWeight: 20
        - pause: {duration: 30s}
        - setWeight: 40
        - pause: {duration: 30s}
        - setWeight: 60
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}

    # ── 블루그린 (부록 F): 새 버전을 띄워 전환 전에 한 번 분석, 통과하면 자동 전환 ──
    # blueGreen:
    #   activeService: spring-error-app
    #   previewService: spring-error-app-preview
    #   prePromotionAnalysis:
    #     templates:
    #       - templateName: error-rate-once
    #     args:
    #       - name: service-name
    #         value: spring-error-app-preview

    # ── 롤링 (부록 E): 차례로 전부 교체한 뒤 한 번 분석 ──
    # canary:
    #   maxSurge: 1
    #   maxUnavailable: 0
    #   steps:
    #     - setWeight: 100
    #     - analysis:
    #         templates:
    #           - templateName: error-rate-once
    #         args:
    #           - name: service-name
    #             value: spring-error-app
