apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: spring-error-app
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: spring-error-app
  template:
    metadata:
      labels:
        app: spring-error-app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: localhost:30002/member-a/spring-error-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ERROR_RATE
              value: "0"
            - name: APP_VERSION
              value: "v5"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  strategy:
    canary:
      canaryService: spring-error-app-canary
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: canary-error-rate
        - setWeight: 60
        - pause:
            duration: 30s
