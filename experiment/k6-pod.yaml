# 클러스터 안에서 부하를 보내는 k6 Pod. run.sh가 __RPS__를 서버별 값으로 바꿔 띄운다.
# PC에서 port-forward로 보내면 Pod 하나로만 가서 클러스터 안에서 돌린다.
apiVersion: v1
kind: Pod
metadata:
  name: k6
  namespace: member-a
  labels:
    role: load
spec:
  restartPolicy: Never
  containers:
    - name: k6
      image: grafana/k6:1.8.2
      args: ["run", "--include-system-env-vars", "--quiet", "--summary-mode=disabled", "--out", "csv=/dev/stdout", "/scripts/load.js"]
      env:
        - name: RPS
          value: "__RPS__"
        - name: DURATION
          value: "30m"
        - name: TARGET
          value: "http://spring-error-app.member-a/api/hello"   # 사용자 요청이 가는 기본 Service
      volumeMounts:
        - name: script
          mountPath: /scripts
  volumes:
    - name: script
      configMap:
        name: k6-script
