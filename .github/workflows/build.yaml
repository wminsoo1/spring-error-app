name: build
on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**', 'experiment/**']   # CI가 고친 배포 파일 커밋으로는 다시 돌지 않게
permissions:
  contents: write
jobs:
  build:
    runs-on: self-hosted
    env:
      IMAGE: harbor.lab:30002/member-a/spring-error-app     # 실습 DNS 이름 (전: localhost:30002)
    steps:
      - uses: actions/checkout@v4

      - name: Harbor 로그인
        env:
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "$HARBOR_PASSWORD" | docker login harbor.lab:30002 -u admin --password-stdin

      - name: 이미지 빌드·push
        id: build
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG
          echo "ref=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:$TAG)" >> "$GITHUB_OUTPUT"   # 서명할 digest 주소

      - name: Cosign 서명
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --key env://COSIGN_KEY \
            --signing-config .github/cosign/signing-config.json \
            --allow-http-registry \
            "${{ steps.build.outputs.ref }}"

      - name: 배포 파일 태그 변경·커밋
        run: |
          TAG=${GITHUB_SHA::7}
          sed -i "s|^  tag: .*|  tag: $TAG|" deploy/chart/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: $TAG"
          git push
